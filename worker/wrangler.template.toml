# The Worker's settings, minus the one value that differs per deployment: the id of the D1 database.
# scripts/setup.mjs and "npm run deploy" copy this file to wrangler.toml with the id filled in.
name = "edge-store"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets (set with scripts/setup.mjs): ACCESS_TOKEN, TG_BOT_TOKEN

# The web page. The Worker runs first even for these files, because only it can send a plain
# http request to https; it then hands them over through the ASSETS binding.
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "edge-store"
database_id = "REPLACE_ME"

[triggers]
crons = ["* * * * *"]
